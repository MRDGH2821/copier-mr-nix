---
author: MRDGH2821
dependencies:
  apm:
    - git: https://github.com/vercel-labs/skills
      ref: 1.5.23
      skills:
        - find-skills
    - git: https://github.com/github/awesome-copilot
      skills:
        - git-commit
    - git: https://github.com/oxsecurity/megalinter
      ref: 10.0.0
  mcp:
    - args:
        - mcp-nixos
      command: uvx
      name: mcp-nixos
      registry: false
      transport: stdio
description: Copier template for my projects
includes: auto
name: copier-mr-nix
scripts:
  antigravity: agy plugin install https://github.com/obra/superpowers
  claude: |
    claude plugin marketplace add obra/superpowers-marketplace
    claude plugin install superpowers@superpowers-marketplace
  cursor: cursor-agent plugin marketplace add https://github.com/obra/superpowers
  opencode: opencode plugin superpowers@git+https://github.com/obra/superpowers.git -g
targets:
  - antigravity
  - claude
  - cursor
  - opencode
version: 1.1.0
